<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>CYBER EMOJI CORE - 完全版</title>
<style>
*{
  margin:0; padding:0; box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
:root{
  --cyan:#00e5ff; --pink:#ff3cf7; --green:#00ff9d; --red:#ff355b; --gold:#ffd700;
  --panel:#0b1322; --panel2:#121f35;
}
body{
  background:#050816; color:#fff; overflow-x:hidden;
  background-image: radial-gradient(circle at top,#0b2748 0%,#050816 55%), linear-gradient(135deg,#08111f,#02040a);
}
/* ヘッダ/タブ */
header{
  padding:12px; position:sticky; top:0; z-index:100;
  background:rgba(3,6,15,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.topBar{ display:flex; flex-direction:column; gap:8px; }
.moneyBox{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.stat{
  background:linear-gradient(145deg,#0f1930,#091120);
  border:1px solid rgba(0,229,255,.2); border-radius:12px;
  padding:8px; font-size:12px; box-shadow:0 0 10px rgba(0,229,255,.08);
}
.stat b{ display:block; margin-top:4px; word-break:break-all; }
#money{
  font-size:28px; font-weight:900; color:#ffd700;
  text-shadow:0 0 5px #ffd700,0 0 10px #ffcc00,0 0 20px #ffaa00,0 0 40px rgba(255,200,0,.8);
  animation:moneyGlow 1.5s infinite alternate;
}
@keyframes moneyGlow{
  0%{ transform:scale(1); filter:brightness(1); }
  100%{ transform:scale(1.05); filter:brightness(1.3); }
}
.tabs{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.tabBtn{
  flex:none; padding:10px 14px; border:none; border-radius:12px;
  background:#101c33; color:#fff; font-weight:700; font-size:13px; cursor:pointer;
}
.tabBtn.active{ background:linear-gradient(135deg,var(--cyan),#1f7fff); color:#00131b; }
main{ padding:12px; padding-bottom:120px; }
.panel{ display:none; animation:fade .25s; }
.panel.active{ display:block; }
@keyframes fade{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
.section{
  background:linear-gradient(145deg,#0d1628,#121d33);
  border-radius:18px; padding:12px; margin-bottom:14px;
  border:1px solid rgba(255,255,255,.05); box-shadow:0 0 20px rgba(0,0,0,.3);
}
.title{ font-size:18px; font-weight:900; margin-bottom:10px; color:var(--cyan); }
.small{ font-size:11px; opacity:.8; }
/* ガチャ/カード */
.gachaBtns{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
button.action{
  background:linear-gradient(135deg,#00e5ff,#0077ff); border:none; color:#fff;
  padding:12px; border-radius:14px; font-weight:900; font-size:14px; cursor:pointer;
}
button.life{ background:linear-gradient(135deg,#ff3cf7,#ff0055); }
.grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.card{
  background:#0f1930; border-radius:14px; padding:10px; border:1px solid rgba(255,255,255,.05);
  position:relative; overflow:hidden;
}
.card .emoji{ font-size:34px; }
.card .name{ font-size:12px; font-weight:800; margin-top:6px; }
.card .rarity{ font-size:11px; margin-top:5px; opacity:.8; }
.card .sell{ font-size:11px; color:#6effd5; margin-top:4px; }
.sellBtn{
  margin-top:8px; width:100%; border:none; padding:8px; border-radius:10px;
  font-weight:900; font-size:12px; background:linear-gradient(135deg,#ff355b,#ff8844);
  color:#fff; box-shadow:0 0 10px rgba(255,80,80,.4); cursor:pointer;
}
.sellBtn:active{ transform:scale(.96); }
.legendGlow{ box-shadow:0 0 20px rgba(255,215,0,.35); border:1px solid rgba(255,215,0,.4); }
.chimeraGlow{ animation:chimera 1s infinite; border:1px solid rgba(255,0,0,.5); }
@keyframes chimera{
  0%{box-shadow:0 0 10px rgba(255,0,0,.2)}
  50%{box-shadow:0 0 30px rgba(255,0,0,.8)}
  100%{box-shadow:0 0 10px rgba(255,0,0,.2)}
}
/* リスト/行 */
.list{ display:flex; flex-direction:column; gap:8px; max-height:420px; overflow:auto; padding-right:4px; }
.row{
  display:flex; align-items:center; justify-content:space-between;
  background:#0d172a; padding:10px; border-radius:12px; font-size:12px;
  border:1px solid rgba(255,255,255,.08);
}
/* Achievements/Dex 装飾 */
.dexRow{ display:flex; align-items:center; justify-content:space-between; background:#0d172a; padding:10px; border-radius:12px; font-size:12px; }
.dexLeft{ display:flex; align-items:center; gap:10px; }
.dexEmoji{ font-size:22px; }
.dexName{ font-weight:800; }
.dexLocked{ opacity:.4; filter:grayscale(.6); }
.achRow{
  display:flex; align-items:center; justify-content:space-between; background:#0d172a; padding:10px; border-radius:12px; font-size:12px; position:relative;
  transition: box-shadow .25s, border-color .25s, opacity .25s, filter .25s; border:1px solid rgba(255,255,255,.08);
}
.achLocked{ opacity:.45; filter:grayscale(.6); }
.achLocked .achName::before{ content:'🔐 '; }
.achUnlocked{ box-shadow:0 0 16px rgba(0,255,153,.35), inset 0 0 8px rgba(0,255,153,.2); border-color:rgba(0,255,153,.45); opacity:1; filter:none; }
.achName{ font-weight:900; }
/* 研究ボタン */
.researchBuyBtn{
  padding:8px 10px; border:none; border-radius:10px; font-weight:900; font-size:12px;
  background:linear-gradient(135deg,#7afcff,#00a3ff); color:#00131b; cursor:pointer;
}
.researchBuyBtn:disabled{ background:#163048; color:#7aa2c2; opacity:.6; cursor:not-allowed; }
/* ログ */
.log{ font-size:12px; line-height:1.7; max-height:300px; overflow:auto; }
.log a{ color:var(--cyan); text-decoration:underline; }
/* ポップアップ */
.popup{ position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; padding:14px; z-index:999; }
.popup.active{ display:flex; }
.popupBox{
  width:100%; max-width:520px; max-height:85vh; overflow:auto; background:#08111f; border-radius:20px; padding:14px; border:1px solid rgba(255,255,255,.08);
}
.resultGrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; max-height:60vh; overflow:auto; padding-right:4px; }
.closeBtn{ width:100%; margin-top:12px; background:#ff355b; border:none; padding:12px; color:#fff; font-weight:900; border-radius:14px; cursor:pointer; }
/* 警告 */
.warning{ animation:warning .3s infinite; }
@keyframes warning{ 0%{background:#200} 50%{background:#500} 100%{background:#200} }
/* ボス */
.bossBox{ text-align:center; padding:18px; border-radius:18px; background:linear-gradient(145deg,#190b12,#321019); }
.hpBar{ height:18px; background:#222; border-radius:999px; overflow:hidden; margin-top:10px; }
.hpFill{ height:100%; background:linear-gradient(90deg,#ff3d3d,#ffcc00); width:0%; transition:.3s; }
</style>
</head>

/* ====== ガチャ確率 ====== */
function rarityRoll(){
  let pLOW=40, pMID=30, pELI=18, pSUP=10, pLEG=2;
  pLOW  = Math.max(10, pLOW  - 1*GAME.research.luck);
  pMID  = Math.max(10, pMID  - 1*GAME.research.luck);
  pELI  = Math.min(40, pELI  + 0.5*GAME.research.luck);
  pSUP  = Math.min(25, pSUP  + 0.3*GAME.research.legend);
  pLEG  = Math.min(10, pLEG  + 0.2*GAME.research.legend);
  const sumBase = pLOW+pMID+pELI+pSUP+pLEG;
  if(GAME.legendPity>=99){ GAME.legendPity=0; return 'LEGEND'; }
  const r = Math.random()*sumBase;
  if(r < pLOW) return 'LOW';
  if(r < pLOW+pMID) return 'MID';
  if(r < pLOW+pMID+pELI) return 'ELITE';
  if(r < pLOW+pMID+pELI+pSUP){ GAME.legendPity++; return 'SUPER'; }
  GAME.legendPity=0; return 'LEGEND';
}
function getRandomByRarity(r){
  const arr = CHARACTERS.filter(c=>c.rarity===r);
  return JSON.parse(JSON.stringify(arr[Math.floor(Math.random()*arr.length)]));
}

/* ====== ガチャ ====== */
function normalGacha(times){
  const cost = times===10 ? 30000 : 3000;
  if(GAME.money<cost) return alert('お金不足');
  if(GAME.owned.length+times>GAME.baseCap) return alert('基地容量不足');
  GAME.money -= cost;
  const results=[];
  for(let i=0;i<times;i++){
    const rarity = rarityRoll();
    const char = getRandomByRarity(rarity);
    results.push(char);
    obtain(char);
  }
  showResults(results);
}
function lifeGacha(times){
  const cost = times===10 ? 200 : 20;
  if(GAME.lp<cost) return alert('LP不足');
  if(GAME.owned.length+times>GAME.baseCap) return alert('基地容量不足');
  GAME.lp -= cost;
  const chimeras = CHARACTERS.filter(c=>c.rarity==='CHIMERA');
  const results=[];
  for(let i=0;i<times;i++){
    const c = JSON.parse(JSON.stringify(chimeras[Math.floor(Math.random()*chimeras.length)]));
    results.push(c);
    obtain(c);
  }
  document.body.classList.add('warning');
  setTimeout(()=>document.body.classList.remove('warning'),2000);
  showResults(results);
}

/* ====== 研究 ====== */
function buyResearch(r){
  if(GAME.crystal < r.cost){ alert('結晶不足'); return; }
  GAME.crystal -= r.cost;
  if(!GAME.research[r.key]) GAME.research[r.key]=0;
  GAME.research[r.key]++;
  applyResearchEffect(r.key);
  addLog(`研究完了 ▶ ${r.name}（Lv.${GAME.research[r.key]}）`);
  updateUI();
}
function applyResearchEffect(key){
  switch(key){
    case 'cap': GAME.baseCap += 5; break;
    case 'life': GAME.lp += 1; break;
    // その他は内部補正（確率/進行系）で参照
  }
}

  const h = new Date().getHours();
  if(h>=6 && h<=7) return 'MORNING';
  if(h>=12 && h<=13) return 'NOON';
  if(h>=18 && h<=19) return 'NIGHT';
  return 'OFF';
}

function currentMonthPool(){
  const m = new Date().getMonth()+1; // 1-12
  return MONTH_EVENT_POOLS[m] || [];
}

function pickBossForBand(band){
  if(band==='MORNING'){
    const pool = CHARACTERS.filter(c=>c.rarity==='CHIMERA');
    return clone(pool[Math.floor(Math.random()*pool.length)]);
  }
  if(band==='NOON'){
    // 指定月の3種から選択
    const pool = currentMonthPool();
    if(pool.length===0) return null;
    return clone(pool[Math.floor(Math.random()*pool.length)]);
  }
  if(band==='NIGHT'){
    if(Math.random()<0.5){
      const pool = CHARACTERS.filter(c=>['LEGEND','SUPER','ELITE'].includes(c.rarity));
      return clone(pool[Math.floor(Math.random()*pool.length)]);
    }else{
      const pool = currentMonthPool();
      if(pool.length===0) return null;
      return clone(pool[Math.floor(Math.random()*pool.length)]);
    }
  }
  return null;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function spawnBossAuto(){
  const band = getTimeBand();
  if(band==='OFF') { clearBossIfOffband(); return; }
  const sk = slotKeyForNow();
  if(lastSpawnSlotKey === sk && bossHP>0) { updateBossBar(); return; }
  const bossChar = pickBossForBand(band);
  if(!bossChar){ clearBossIfOffband(); return; }
  const hpBase = Math.min(5_000_000, Math.max(10_000, Math.floor(bossChar.sell * 2)));
  bossHP = bossMax = hpBase;
  currentBoss = bossChar;
  lastSpawnSlotKey = sk;
  document.getElementById('bossName').innerText = `👹 ボス出現 ▶ ${bossChar.name}`;
  document.getElementById('bossText').innerText = `${bossHP} / ${bossMax}`;
  updateBossBar();
  addLog(`👹 ボス出現 ▶ ${bossChar.name}（${getTimeBand()}）`);
}

function clearBossIfOffband(){
  const now = Date.now();
  if(now < bossNoEscape) { updateBossBar(); return; }
  document.getElementById('bossName').innerText='ボス待機中...';
  document.getElementById('bossText').innerText='出現時間を待機';
  document.getElementById('bossHp').style.width='0%';
  bossHP = bossMax = 0;
  currentBoss = null;
}

function updateBossBar(){
  if(bossMax<=0){ document.getElementById('bossHp').style.width='0%'; return; }
  const p = Math.max(0, Math.min(100, (bossHP/bossMax)*100));
  document.getElementById('bossHp').style.width = p+'%';
  document.getElementById('bossText').innerText = `${bossHP} / ${bossMax}`;
}

function attackBoss(){
  if(bossHP<=0 || !currentBoss) return;
  let dmg = 100 + countRarity('LEGEND')*150 + (countRarity('CHIMERA')+countRarity('EVENT'))*500;
  bossHP -= dmg;
  if(bossHP<0) bossHP=0;
  updateBossBar();
  if(bossHP===0){
    GAME.money += 500_000;
    GAME.lp += 5;
    bossKill++;
    obtain(clone(currentBoss));
    addLog('⚔️ ボス撃破 ▶ '+currentBoss.name+'（+¥500,000 / +5LP / 本体入手）');
    currentBoss = null;
    alert('ボス撃破！');
    updateUI();
  }
}

function forceSpawnBoss(){
  const cost = 1_000_000_000;
  if(GAME.money<cost) return alert('10億円必要です');
  GAME.money -= cost;
  const band = getTimeBand();
  if(band==='OFF'){
    // OFF帯は月別イベントに寄せたロジックへ変更
    const weight = Math.random();
    let bossChar;
    if(weight<0.5){
      const pool = CHARACTERS.filter(c=>c.rarity==='CHIMERA');
      bossChar = clone(pool[Math.floor(Math.random()*pool.length)]);
    }else if(weight<0.8){
      const pool = CHARACTERS.filter(c=>c.rarity==='LEGEND');
      bossChar = clone(pool[Math.floor(Math.random()*pool.length)]);
    }else{
      const pool = currentMonthPool();
      bossChar = clone(pool[Math.floor(Math.random()*pool.length)]);
    }
    const hpBase = Math.min(5_000_000, Math.max(10_000, Math.floor(bossChar.sell * 2)));
    bossHP = bossMax = hpBase;
    currentBoss = bossChar;
    document.getElementById('bossName').innerText = `👹 強制出現 ▶ ${bossChar.name}`;
    updateBossBar();
    addLog(`💎 強制出現 ▶ ${bossChar.name}`);
  }else{
    const bossChar = pickBossForBand(band);
    const hpBase = Math.min(5_000_000, Math.max(10_000, Math.floor(bossChar.sell * 2)));
    bossHP = bossMax = hpBase;
    currentBoss = bossChar;
    document.getElementById('bossName').innerText = `👹 強制出現 ▶ ${bossChar.name}`;
    updateBossBar();
    addLog(`💎 強制出現 ▶ ${bossChar.name}（${band}）`);
  }
  updateUI();
}

/* ====== 補助 ====== */
function countRarity(r){ return GAME.owned.filter(x=>x.rarity===r).length; }
function countName(n){ return GAME.owned.filter(x=>x.name===n).length; }

/* ====== タイマー ====== */
setInterval(()=>{ spawnBossAuto(); }, 60_000);

/* ====== 起動 ====== */
document.addEventListener('DOMContentLoaded', ()=>{
  load();
  tabsInit();
  if(GAME.logs.length===0){
    addLog('🏆 実績は未達成時は🔐ロック、達成で緑に発光します。');
    addLog('📚 図鑑は未入手は❓/？？？、入手で開示されます。');
    addLog('⚔️ ボスは 06-07（最上位）、12-13（当月のイベント3種）、18-19（通常or当月イベント）に1時間ごと1体出現します。');
    addLog('💎 強制出現は10億円が必要です。');
  }
  updateUI();
  spawnBossAuto();
});
</script>
